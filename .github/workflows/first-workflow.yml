name: Python CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168217059640:role/GitHubActions-ECR-Role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        run: |
          docker tag github-actions-learning:latest 168217059640.dkr.ecr.eu-north-1.amazonaws.com/github-actions-learning:latest
          docker push 168217059640.dkr.ecr.eu-north-1.amazonaws.com/github-actions-learning:latest  

        
