name: Python CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Python
        run: python app.py

      - name: Build Docker image
        run: docker build -t github-actions-learning:latest .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::168217059640:role/GitHubActions-ECR-Role-1
          aws-region: eu-north-1
